name: Package CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  PHP_BIN: php

jobs:
  dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            preference: --prefer-lowest
          - php: '8.5'
            preference: --prefer-stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Select synchronized root version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "COMPOSER_ROOT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo 'COMPOSER_ROOT_VERSION=dev-main' >> "$GITHUB_ENV"
          fi
      - run: ./scripts/composer.sh validate --strict
      - name: Configure synchronized package sources
        run: |
          ./scripts/composer.sh config minimum-stability dev
          ./scripts/composer.sh config prefer-stable true
          true
      - run: ./scripts/composer.sh update --no-interaction --prefer-dist ${{ matrix.preference }}
      - run: ./scripts/composer.sh audit
      - run: find src -type f -name '*.php' -print0 | xargs -0 -n1 ./scripts/php-bin.sh -l
      - run: |
          ./scripts/php-bin.sh -r 'require "vendor/autoload.php"; exit(class_exists("SohoPHP\\SoFinder\\FileManager") ? 0 : 1);'
